<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubbly clock</title>
    <style>
        @font-face {
            font-family: 'GoogleSansFlex';
            src: url('assets/GoogleSansFlex.ttf') format('truetype');
        }

        :root {
          --color-hour-tens: #c778d7;
          --color-hour-ones: #e868b4;
          --color-min-tens:  #a688fa;
          --color-min-ones:  #a32db5;

          --swing-speed: 6s;
          overflow:hidden;
        }

        body {
          background-color: #000000;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          font-family: 'GoogleSansFlex', sans-serif;
          font-variation-settings: "ROND" 100, "GRAD" 10 ;
          font-size: 42vw;
          font-weight: 900;
          letter-spacing: -0.02em;
          user-select: none;
          overflow: hidden;
        }

        .clock-container {
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .digit-group {
          mix-blend-mode: screen;
        }

        @keyframes sway {
          0% { transform: rotate(-3deg); }
          100% { transform: rotate(3deg); }
        }

        .swing {
          display: inline-block;
          animation: sway var(--swing-speed) ease-in-out infinite alternate;
          transform-origin: center center;
        }

        @keyframes pop {
          0% { transform: scale(1) translateY(0); }
          40% { transform: scale(1.15) translateY(-0.06em); }
          100% { transform: scale(1) translateY(0); }
        }

        .digit {
          display: inline-block;
          transform-origin: bottom center;
        }

        .animate {
          animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #group-hour-tens {
          color: var(--color-hour-tens);
          display: inline-block;
          transform: rotate(4deg);
          margin-right: -0.05em;
          position: relative;
          z-index: 1;
        }

        #group-hour-ones {
          color: var(--color-hour-ones);
          display: inline-block;
          transform: rotate(-3deg);
          margin-right: 0.05em;
          position: relative;
          z-index: 0;
        }

        #colon {
          display: inline-flex;
          flex-direction: column;
          justify-content: center;
          gap: 0.12em;
          margin: 0 -0.08em;
          transform: translateY(-0.04em);
          position: relative;
          z-index: 1;
        }

        .dot {
          width: 0.15em;
          height: 0.15em;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.8);
          backdrop-filter: blur(5px);
          -webkit-backdrop-filter: blur(5px);
          box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.1);
        }

        #group-min-tens {
          color: var(--color-min-tens);
          display: inline-block;
          transform: rotate(-8deg) translateY(0.02em);
          margin-right: -0.08em;
          position: relative;
          z-index: 0;
        }

        #group-min-ones {
          color: var(--color-min-ones);
          display: inline-block;
          transform: rotate(5deg) translateY(-0.02em);
          position: relative;
          z-index: 1;
        }
    </style>
</head>
<body>

<div class="clock-container">

    <span class="digit-group" id="group-hour-tens" style="display: none;">
      <span class="swing" style="animation-delay: -2s;">
        <span id="hour-tens" class="digit"></span>
      </span>
    </span>

    <span class="digit-group" id="group-hour-ones">
      <span class="swing" style="animation-delay: -4s;">
        <span id="hour-ones" class="digit">9</span>
      </span>
    </span>

    <div id="colon" class="swing" style="animation-delay: -1s;">
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <span class="digit-group" id="group-min-tens">
      <span class="swing" style="animation-delay: -5s;">
        <span id="min-tens" class="digit">4</span>
      </span>
    </span>

    <span class="digit-group" id="group-min-ones">
      <span class="swing" style="animation-delay: -3s;">
        <span id="min-ones" class="digit">1</span>
      </span>
    </span>

</div>

<script>
    let prevHourTens = '';
    let prevHourOnes = '';
    let prevMinTens = '';
    let prevMinOnes = '';

    window.twentyFourHour = false;
    try {
      if (window.AndroidSensors && typeof window.AndroidSensors.getCustomizations === 'function') {
        const cust = JSON.parse(window.AndroidSensors.getCustomizations());
        if (cust.twentyFourHour !== undefined) {
          window.twentyFourHour = (cust.twentyFourHour === true || cust.twentyFourHour === "true");
        }
      }
    } catch (e) {}

    function updateAndAnimate(id, newValue, prevValue) {
      if (newValue !== prevValue) {
        const element = document.getElementById(id);
        element.textContent = newValue;

        element.classList.remove('animate');
        void element.offsetWidth;
        element.classList.add('animate');
      }
      return newValue;
    }

    function updateClock() {
      const now = new Date();

      let hours = now.getHours();
      if (!window.twentyFourHour) {
        hours = hours % 12 || 12;
      }
      const hoursStr = hours.toString().padStart(2, '0');

      const hTens = hoursStr[0];
      const hOnes = hoursStr[1];

      document.getElementById('group-hour-tens').style.display = 'inline-block';

      const minutes = now.getMinutes().toString().padStart(2, '0');

      prevHourTens = updateAndAnimate('hour-tens', hTens, prevHourTens);
      prevHourOnes = updateAndAnimate('hour-ones', hOnes, prevHourOnes);
      prevMinTens = updateAndAnimate('min-tens', minutes[0], prevMinTens);
      prevMinOnes = updateAndAnimate('min-ones', minutes[1], prevMinOnes);
    }

    window.onCustomizationChanged = (changes) => {
      if (changes.twentyFourHour !== undefined) {
        window.twentyFourHour = (changes.twentyFourHour === true || changes.twentyFourHour === "true");
      }
      updateClock();
    };

    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
